name: Build

on:
  workflow_run:
    workflows: ["Copilot Review Gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    # Build only after the Copilot Review Gate workflow completed successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify
